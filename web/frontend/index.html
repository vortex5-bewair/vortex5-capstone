<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Fallback/default; AppRoutes overrides this per-page via useDocumentTitle. -->
    <title>BewAir</title>

    <!-- Fonts.
         These were previously pulled in by an @import at the top of index.css,
         which is the slowest possible placement: the browser had to download
         our whole stylesheet before it could even discover the font request,
         then fetch the Google stylesheet, then the font files — three serial
         round trips to an origin nothing had warmed up. Declaring them here
         lets the font CSS download in parallel with ours, and the preconnects
         open the connections up front. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Poppins:wght@600;700;800&display=swap"
    />

    <!-- Global CSS -->
    <link rel="stylesheet" href="./src/index.css" />
  </head>
  <body>
    <!-- React root -->
    <div id="root"></div>

    <!-- Vite entry point -->
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
